
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Personal Upgrade Discovery | Jonathan Fok</title>

<style>
:root{
  --navy:#1F4E78;
  --muted:#697989;
  --line:#E0E6EC;
  --ivory:#F4F3EE;
  --blue:#F0F4F7;
  --teal:#65ADA2;
  --orange:#DDA45C;
  --loan:#5685AF;
  --purple:#8972CE;
  --danger:#B45E49;
  --success:#338363;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#edf1f4;
  color:#293d4e;
  font-family:Inter,-apple-system,BlinkMacSystemFont,
    "Segoe UI",Arial,sans-serif;
}

main{
  max-width:750px;
  margin:30px auto;
  background:white;
  border:1px solid #e5e9ee;
  border-radius:22px;
  padding:25px;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  opacity:.35;
  cursor:default;
}

.brand{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  font-size:10px;
  font-weight:750;
  letter-spacing:.6px;
  color:var(--navy);
}

.brand span{
  display:flex;
  align-items:center;
  gap:6px;
}

.reset{
  border:0;
  background:transparent;
  color:#768697;
  font-size:12px;
}

.hero{
  display:flex;
  align-items:center;
  gap:15px;
  margin:22px 0 16px;
}

.avatar{
  width:68px;
  height:68px;
  border-radius:100%;
  background:#e1eaf2;
  display:grid;
  place-items:center;
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  border-radius:100%;
  object-fit:cover;
}

.eyebrow,
.section-label{
  font-size:11px;
  font-weight:750;
  letter-spacing:.65px;
  color:var(--navy);
}

.hero h1{
  margin:5px 0 2px;
  color:var(--navy);
  font-size:24px;
  line-height:1.13;
  font-weight:750;
}

.hero h1 span{
  display:block;
  color:#64788b;
  font-weight:450;
}

.hero p{
  font-size:12px;
  color:#64788b;
  margin:7px 0 0;
}

.rule{
  height:2px;
  width:36px;
  background:var(--navy);
  margin:12px 0;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin:12px 0 15px;
}

.tab{
  border:0;
  background:#f0f4f7;
  color:var(--navy);
  border-radius:8px;
  padding:10px 3px;
  font-size:14px;
  font-weight:700;
}

.tab small{
  display:block;
  font-size:9px;
  margin-bottom:3px;
  color:#718395;
  letter-spacing:.5px;
}

.tab.active{
  background:var(--navy);
  color:white;
}

.tab.active small{
  color:#d5e4f0;
}

.intro{
  background:var(--ivory);
  padding:19px;
  border-radius:14px;
  margin:0 0 20px;
}

.intro small{
  font-size:10px;
  color:#6d6254;
  font-weight:750;
  letter-spacing:.6px;
}

.intro h2{
  font-size:24px;
  line-height:1.17;
  margin:16px 0 13px;
  color:#293d4e;
}

.intro h2 span{
  display:block;
  font-weight:450;
  color:#70695f;
}

.gold-rule{
  height:2px;
  width:36px;
  background:#a18a66;
}

.section-label{
  display:block;
  margin:18px 0 10px;
}

.journeys{
  display:grid;
  gap:8px;
}

.journey{
  display:flex;
  align-items:center;
  gap:12px;
  background:white;
  border:1px solid var(--line);
  border-radius:11px;
  padding:13px;
  width:100%;
  text-align:left;
  color:var(--navy);
  font-size:14px;
  font-weight:650;
}

.journey.active{
  background:#eef4f9;
  border-color:var(--navy);
}

.journey .ico{
  width:34px;
  height:34px;
  border-radius:8px;
  background:#f1f4f6;
  display:grid;
  place-items:center;
  font-size:18px;
}

.journey .tick{
  margin-left:auto;
  color:var(--navy);
  font-size:19px;
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
  min-width:0;
}

.field label{
  font-size:13px;
  font-weight:700;
  color:var(--navy);
  padding-left:15px;
}

.input-row{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
}

input{
  width:100%;
  min-width:0;
  border:1px solid #d5dde6;
  border-radius:8px;
  background:white;
  padding:10px 12px;
  color:#293d4e;
  outline:none;
}

input:focus{
  border-color:var(--navy);
  box-shadow:0 0 0 2px #dce8f2;
}

.input-row input{
  flex:1;
}

.panel{
  background:var(--blue);
  border-radius:12px;
  padding:17px;
  margin-top:16px;
}

.row,
.line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.line{
  font-size:12px;
  color:var(--muted);
  margin:10px 0;
}

.line strong{
  color:var(--navy);
  font-weight:650;
}

hr{
  border:0;
  border-top:1px solid #d6dce4;
  margin:15px 0;
}

.big{
  font-size:30px;
  font-weight:750;
  color:var(--navy);
  letter-spacing:-.8px;
}

.mid{
  font-size:20px;
  font-weight:750;
  color:var(--navy);
}

.small{
  font-size:11px;
  color:var(--muted);
  line-height:1.5;
}

.segment{
  display:flex;
  gap:4px;
  background:#f0f4f7;
  border-radius:8px;
  padding:4px;
}

.segment button{
  flex:1;
  min-width:0;
  border:0;
  background:transparent;
  color:#627689;
  border-radius:6px;
  padding:9px 6px;
  font-size:12px;
  font-weight:650;
}

.segment button.active{
  background:var(--navy);
  color:white;
}

.btn{
  border:1px solid #d0dbe4;
  background:white;
  color:var(--navy);
  padding:9px 12px;
  border-radius:9px;
  font-size:12px;
  font-weight:650;
}

.btn.active{
  background:var(--navy);
  color:white;
  border-color:var(--navy);
}

.presets{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-top:9px;
}

.stack{
  display:flex;
  height:11px;
  border-radius:50px;
  overflow:hidden;
  background:#e5ebe8;
  margin:10px 0;
}

.stack div{
  height:100%;
}

.label-dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:100%;
  margin-right:5px;
}

.buyer-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:15px 0;
}

.buyer-name{
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--navy);
  font-size:12px;
  font-weight:750;
}

.buyer-icon{
  width:30px;
  height:30px;
  border-radius:100%;
  background:#e6edf3;
  display:grid;
  place-items:center;
  font-size:15px;
}

.chart-row{
  display:flex;
  align-items:center;
  gap:9px;
  margin:7px 0;
}

.chart-label{
  width:58px;
  font-size:10px;
  color:var(--muted);
  flex-shrink:0;
}

.chart-track{
  height:12px;
  border-radius:30px;
  background:#e8efed;
  flex:1;
  overflow:hidden;
  display:flex;
}

.chart-value{
  width:74px;
  text-align:right;
  font-size:10px;
  color:#485e72;
}

.result-card{
  border-radius:13px;
  padding:17px;

  margin:14px 0;
}

.result-card.a{
  background:#eff4f8;
}

.result-card.b{
  background:#f3f4f1;
}

.card-head{
  display:flex;
  align-items:start;
  justify-content:space-between;
  gap:12px;
  cursor:pointer;
}

.card-head small{
  font-size:10px;
  color:var(--navy);
  font-weight:750;
}

.card-head h3{
  font-size:22px;
  line-height:1.15;
  margin:12px 0 10px;
  color:var(--navy);
}

.card-head h3 span{
  display:block;
  color:#738698;
  font-weight:450;
}

.metrics{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin:14px 0;
}

.metric .small{
  display:block;
  margin-bottom:5px;
}

.accordion{
  border:1px solid #c7d4e0;
  border-radius:12px;
  padding:16px;
  margin:15px 0;
}

.acc-button{
  background:transparent;
  border:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:100%;
  color:var(--navy);
  font-size:11px;
  font-weight:750;
  letter-spacing:.5px;
  text-align:left;
}

.year-row{
  margin:14px 0;
}

.year-row .row{
  font-size:11px;
  color:var(--muted);
}

.nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:16px;
}

footer{
  font-size:10px;
  line-height:1.55;
  color:#788591;
  margin-top:18px;
}

.warning{
  font-size:12px;
  color:var(--danger);
  margin:10px 0;
}

.upfront-breakdown{
  display:flex;
  flex-direction:column;
  gap:0;
  margin-top:1px;
  font-size:11px;
  line-height:1.15;
  color:var(--muted);
}

/* =====================================
   PURCHASE FUNDING MIX
===================================== */

.funding-mix{
  margin:16px 0 6px;
}

.funding-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  color:var(--navy);
}

.funding-head strong{
  font-size:14px;
}

.funding-head span{
  color:var(--muted);
  font-size:13px;
}

.funding-guide{
  position:relative;
  padding-top:28px;
  margin-top:14px;
}

.funding-guide-label{
  position:absolute;
  top:0;
  transform:translateX(-50%);
  font-size:12px;
  color:#52695c;
  font-weight:700;
}

.funding-guide-label.last{
  transform:translateX(-100%);
}

.funding-track{
  height:30px;
  position:relative;
}

.funding-fill{
  height:100%;
  display:flex;
  border-radius:999px;
  overflow:hidden;
  background:#e5ebe8;
}

.funding-marker{
  position:absolute;
  top:-5px;
  height:40px;
  border-left:2px dashed #355f45;
  pointer-events:none;
  z-index:2;
}

.funding-marker.end{
  border-left-style:solid;
  transform:translateX(-2px);
}

.funding-legend{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:5px;
  text-align:center;
  margin-top:18px;
}

.funding-legend .mid{
  font-size:14px;
  overflow-wrap:anywhere;
}

.funding-note{
  font-size:11px;
  color:var(--muted);
  margin-top:12px;
}

/* =====================================
   INCOME-BASED PURCHASE CAPACITY
===================================== */

.capacity-header{
  font-size:13px;
  letter-spacing:.3px;
}

.capacity-title{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.capacity-title svg{
  width:26px;
  height:26px;
  fill:none;
  stroke:var(--navy);
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  flex-shrink:0;
}

.capacity-price{
  text-align:center;
  margin:22px 0;
}

.capacity-price .big{
  margin:8px 0;
  font-size:32px;
}

.capacity-price .small{
  font-size:12px;
}

.capacity-metrics{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin:18px 0;
}

.capacity-metrics .small{
  font-size:13px;
}

.capacity-metrics .mid{
  margin-top:7px;
}

.capacity-subtext{
  font-size:11px;
  color:var(--muted);
  margin-top:5px;
}

.capacity-danger{
  color:var(--danger)!important;
}

.capacity-success{
  color:var(--success)!important;
}

.capacity-neutral{
  color:var(--navy)!important;
}

.capacity-position{
  padding:18px;
  margin-top:18px;
  border-radius:14px;
}

.capacity-breakdown{
  font-size:13px!important;
  letter-spacing:0!important;
  padding:8px 0;
  margin-top:16px;
}

.capacity-footnote{
  font-size:11px;
  color:var(--muted);
  margin-top:20px;
}

/* 25% DOWNPAYMENT BAR */

.capacity-down-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin:19px 0 12px;
}

.capacity-down-head strong{
  font-size:12px;
  letter-spacing:.4px;
  color:var(--navy);
}

.capacity-down-head span{
  font-size:12px;
  color:var(--muted);
}

.capacity-fund-bar{
  width:100%;
  height:13px;
  border-radius:99px;
  overflow:hidden;
  display:flex;
  background:#edf1f4;
}

.capacity-five{
  width:20%;
  display:flex;
  overflow:hidden;
  border-right:2px solid #fff;
}

.capacity-twenty{
  width:80%;
  display:flex;
  overflow:hidden;
}

.capacity-good-cash{
  background:#3D85BC;
}

.capacity-good-cpf{
  background:#53A98A;
}

.capacity-missing-cash{
  background:repeating-linear-gradient(
    135deg,
    #C66D66 0 3px,
    #cbdfea 3px 8px
  );
}

.capacity-missing-cpf{
  background:repeating-linear-gradient(
    135deg,
    #C66D66 0 3px,
    #cbe7db 3px 8px
  );
}

.capacity-bar-part{
  height:100%;
  flex-shrink:0;
}

.capacity-bar-labels{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:15px 0 11px;
}

.capacity-bar-label{
  display:flex;
  gap:8px;
  align-items:flex-start;
  justify-content:center;
  font-size:12px;
  color:var(--navy);
}

.capacity-bar-label strong{
  display:block;
  font-size:12px;
}

.capacity-bar-label small{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.capacity-dot{
  width:10px;
  height:10px;
  border-radius:3px;
  display:inline-block;
  flex:0 0 10px;
  margin-top:2px;
}

.capacity-legend{
  display:flex;
  flex-wrap:wrap;
  gap:8px 15px;
  margin:13px 0;
}

.capacity-legend span{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
}

.capacity-legend b{
  color:var(--navy);

  font-weight:700;
}

.capacity-position-title{
  font-size:12px;
  letter-spacing:.5px;
  font-weight:800;
  color:var(--navy);
}

.capacity-position-primary{
  margin-top:14px;
  display:grid;
  grid-template-columns:
    minmax(0,1fr) minmax(0,1fr);
  gap:15px;
  align-items:center;
}

.capacity-position-amount{
  font-size:clamp(21px,5vw,30px);
  font-weight:780;
  overflow-wrap:anywhere;
  margin:5px 0;
}

.capacity-position-breakdown{
  border-left:1px solid #d5e0e8;
  padding-left:14px;
}

.capacity-pos-line{
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:space-between;
  font-size:11px;
  color:var(--muted);
  margin:9px 0;
}

.capacity-pos-line strong{
  font-size:12px;
}

.capacity-message{
  font-size:12px;
  line-height:1.5;
  color:var(--danger);
  margin:16px 0;
}

/* =====================================
   MORTGAGE PROTECTION
===================================== */

.protect-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.protect-head h4{
  margin:0;
  font-size:18px;
}

.protect-sub{
  font-size:12px;
  color:var(--muted);
  margin-top:5px;
}

.protect-toggle{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:0;
  border-radius:999px;
  background:#0EAF43;
  color:white;
  font-size:16px;
  font-weight:750;
  padding:10px 16px;
  min-width:104px;
}

.protect-toggle.off{
  background:#9AA6B2;
}

.protect-toggle svg{
  width:23px;
  height:23px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.protect-row2{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:center;
  margin-top:20px;
}

.protect-period-label{
  font-size:15px;
  color:var(--muted);
}

.period-pills{
  display:flex;
  gap:8px;
}

.period-pill{
  border:1px solid transparent;
  border-radius:999px;
  background:#f0f0f0;
  color:#666;
  font-size:15px;
  padding:12px 16px;
  font-weight:650;
}

.period-pill.active{
  color:#111;
  background:#fff;
  border-color:#e5e5e5;
}

.commit-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:21px;
}

.commit-head h4{
  margin:0;
  font-size:17px;
}

.commit-pp{
  color:#31966A;
  font-size:15px;
  white-space:nowrap;
  font-weight:700;
}

.commit-input{
  margin-top:13px;
}

.commit-input input{
  border:2px solid #d8d8d8;
  border-radius:999px;
  padding:15px 19px;
  font-size:19px;
  min-height:54px;
}

.commit-presets{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}

.commit-pill{
  border:2px solid #d3d3d3;
  border-radius:999px;
  background:transparent;
  color:#666;
  padding:12px 5px;
  font-size:16px;
  font-weight:750;
}

.commit-pill.active{
  background:#171717;
  border-color:#171717;
  color:white;
}

.protect-shield{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-top:18px;
  font-size:14px;
  color:var(--muted);
}

.protect-shield strong{
  color:#293d4e;
  font-size:18px;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin-top:20px;
  text-align:center;
}

.summary-item svg{
  width:32px;
  height:32px;
  fill:none;
  stroke:var(--navy);
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.summary-label{
  color:var(--muted);
  font-size:12px;
  margin-top:9px;
}

.summary-value{
  color:#293d4e;
  font-size:16px;
  font-weight:750;
  margin-top:5px;
  overflow-wrap:anywhere;
}

.life-card{
  display:flex;
  gap:14px;
  align-items:center;
  margin-top:20px;
}

.life-icon{
  width:56px;
  height:56px;
  border-radius:50%;
  background:#e5edf7;
  display:grid;
  place-items:center;
  flex-shrink:0;
}

.life-icon svg{
  width:29px;
  height:29px;
  fill:none;
  stroke:var(--navy);
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.life-kicker{
  color:var(--navy);
  font-size:12px;
  font-weight:800;
  letter-spacing:.5px;
}

.life-text{
  color:#293d4e;
  font-size:17px;
  font-weight:750;
  line-height:1.35;
  margin-top:5px;
}

/* =====================================
   MOBILE RESPONSIVENESS
===================================== */

@media(max-width:450px){

  main{
    margin:0;
    border-radius:0;
    padding:16px;
  }

  .hero h1{

<body>
<main id="app"></main>

<script>
"use strict";

/* =====================================
   APPLICATION STATE
===================================== */

const initial=()=>({
  journey:"private",
  sale:0,
  hdb:0,
  refund:0,
  oa:0,
  pureCash:0,
  pureCPF:0,
  extraOn:false,
  extra:0,
  b2:false,
  b3:false,

  name1:"Buyer 1",
  age1:35,
  wage1:5000,
  status1:"SC",

  name2:"Buyer 2",
  age2:43,
  wage2:6500,
  status2:"SC",

  name3:"Buyer 3",
  age3:30,
  wage3:5000,
  status3:"SC",

  backup:0,
  debts:0,
  rate:3,
  commit:0,
  protection:false,
  period:48,
  choice:"protect"
});

let v=initial();
let tab=0;

const opened={
  capacity:false,
  breakdown:false,
  A:false,
  B:false
};

const $=s=>document.querySelector(s);

const num=x=>
  Math.max(0,Number(x)||0);

const cash=x=>
  "$"+Math.round(Number(x)||0)
  .toLocaleString("en-SG");

const short=x=>
  x>=1e6?
    "$"+(x/1e6).toFixed(2)+"m":
  x>=1e3?
    "$"+(x/1e3).toFixed(1)+"k":
    cash(x);

const esc=s=>String(s).replace(
  /[&<>"']/g,
  c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c])
);

const clamp=(x,a,b)=>
  Math.max(a,Math.min(b,x));

const people=()=>[
  1,
  ...(v.b2?[2]:[]),
  ...(v.b2&&v.b3?[3]:[])
];

/* Round calculated loans DOWN to the nearest $1,000. */

const roundLoan=n=>
  Math.floor(Math.max(0,n)/1000)*1000;

/* =====================================
   STAMP DUTY
===================================== */

function bsd(price){

  let left=price;
  let sum=0;

  for(const [width,rate] of [
    [180000,.01],
    [180000,.02],
    [640000,.03],
    [500000,.04],
    [1500000,.05],
    [Infinity,.06]
  ]){

    const part=Math.min(
      Math.max(left,0),
      width
    );

    sum+=part*rate;
    left-=part;

    if(left<=0)break;
  }

  return sum;
}

/* =====================================
   MORTGAGE FACTOR
===================================== */

function factor(rate,years){

  const months=years*12;
  const r=rate/1200;

  if(!months)return Infinity;

  return r===0?
    1/months:
    r/(1-Math.pow(1+r,-months));
}

/* =====================================
   CPF OA CONTRIBUTION ESTIMATE
===================================== */

function oaRate(age){

  return age<=35?.23:
    age<=45?.21:
    age<=50?.19:
    age<=55?.15:
    age<=60?.12:
    age<=65?.035:
    age<=70?.01:0;
}

/* =====================================
   BENCHMARK FUNDING ALLOCATION
===================================== */

/*
  The 25% downpayment consists of:

  - 5% minimum cash
  - 20% CPF and/or additional cash

  The bar never extends for surplus.

  Shortfall appears inside the relevant
  5% or 20% section.

  Stamp duty and fees are assessed
  separately.

  Funding Position displays either:
  - Shortfall
  - Surplus
  - Exactly funded

  Surplus is split into remaining
  cash and CPF OA.
*/

function allocateFunding(price, availableCash, cpf, fees){
  // Fees are funded first (eligible CPF OA, then cash).
  const feeCPF=Math.min(cpf,fees);
  const feeCash=Math.min(availableCash,fees-feeCPF);
  const feeShort=Math.max(0,fees-feeCPF-feeCash);
  let cpfRemain=cpf-feeCPF;
  let cashRemain=availableCash-feeCash;

  // Preserve the mandatory 5% cash downpayment.
  const cashNeed=.05*price;
  const twentyNeed=.20*price;
  const cash5=Math.min(cashRemain,cashNeed);
  const cashShort=Math.max(0,cashNeed-cash5);
  cashRemain-=cash5;

  // Remaining 20% may be funded by CPF OA or cash.
  const cpf20=Math.min(cpfRemain,twentyNeed);
  cpfRemain-=cpf20;
  const cash20=Math.min(cashRemain,twentyNeed-cpf20);
  cashRemain-=cash20;
  const twentyShort=Math.max(0,twentyNeed-cpf20-cash20);
  const shortfall=feeShort+cashShort+twentyShort;
  const surplus=shortfall<=.005?cashRemain+cpfRemain:0;
  const net=shortfall>.005?-shortfall:surplus;
  return {cashNeed,twentyNeed,cash5,cashShort,cpf20,cash20,
    twentyShort,feeShort,cashRemain,cpfRemain,shortfall,surplus,
    net,feeCash,feeCPF};
}

/* =====================================
   MAIN FINANCIAL CALCULATION ENGINE
===================================== */

function calc(){

  /* Sale proceeds */

  const sale=num(v.sale);

  const fee=sale>0?3000:0;

  const commission=sale*.0218;

  const net=sale>0?
    sale-num(v.hdb)-commission-fee:
    0;

  const refunded=Math.min(
    Math.max(0,net),
    num(v.refund)
  );

  const cashRaw=v.journey==="first"?
    num(v.pureCash):
    Math.max(0,net-refunded)+
    (v.extraOn?num(v.extra):0);

  const cpfRaw=v.journey==="first"?
    num(v.pureCPF):
    refunded+num(v.oa);

  const equity=Math.floor(
    (cashRaw+cpfRaw)/1000
  )*1000;

  const cpf=Math.min(
    equity,
    cpfRaw
  );

  const availableCash=
    equity-cpf;

  /* Buyer income */

  const ids=people();

  const income=ids.reduce(
    (a,i)=>a+num(v["wage"+i]),
    0
  );

  const age=income?
    ids.reduce(
      (a,i)=>
        a+
        num(v["age"+i])*
        num(v["wage"+i]),
      0
    )/income:
    0;

  const tenure=income?
    Math.max(
      0,
      Math.min(
        30,
        Math.floor(65-age)
      )
    ):
    0;

  /* Assessment and loan */

  const assessment=factor(
    4,
    tenure
  );

  const cap=Number.isFinite(
    assessment
  )?
    roundLoan(
      Math.max(
        0,
        income*.55-num(v.debts)
      )/assessment
    ):
    0;

  const monthlyFactor=factor(
    num(v.rate),
    tenure
  );

  const absd=ids.every(
    i=>v["status"+i]==="PR"
  )?.05:0;

  /* CPF OA projection */

  const perBuyer=ids.map(
    i=>Array.from(
      {length:10},
      (_,year)=>
        Math.min(
          8000,
          num(v["wage"+i])
        )*
        oaRate(
          num(v["age"+i])+year
        )
    )
  );

  const combined=Array.from(
    {length:10},
    (_,y)=>
      perBuyer.reduce(
        (s,arr)=>s+arr[y],
        0
      )
  );

  const flows=Array.from(
    {length:48},
    (_,month)=>
      combined[Math.floor(month/12)]
  );

  /* ==================================
     FOUR-YEAR MORTGAGE FORECAST
  ================================== */

  function forecast(
    loan,
    commit,
    protect,
    period
  ){

    const monthly=Number.isFinite(
      monthlyFactor
    )?
      loan*monthlyFactor:
      0;

    let carry=0;
    let needed=0;

    const years=[];

    for(let year=0;year<4;year++){

      let cpfPaid=0;
      let cashPaid=0;
      let shieldPaid=0;

      for(let m=0;m<12;m++){

        const index=year*12+m;

        const pool=
          carry+flows[index];

        const cp=Math.min(
          pool,
          monthly
        );

        const gap=Math.max(
          0,
          monthly-cp
        );

        const active=
          protect&&index<period;

        const ca=active?
          Math.min(commit,gap):
          gap;

        const sh=active?
          gap-ca:
          0;

        carry=Math.max(
          0,
          pool-cp
        );

        cpfPaid+=cp;
        cashPaid+=ca;
        shieldPaid+=sh;
        needed+=sh;
      }

      years.push({
        cpf:cpfPaid/12,
        cash:cashPaid/12,
        shield:shieldPaid/12
      });
    }

    return{
      monthly,
      years,
      shield:protect?
        Math.ceil(needed/1000)*1000:
        0
    };
  }

  /* ==================================
     PROPERTY PURCHASE FEASIBILITY
  ================================== */

  function fit(
    price,
    loan,
    backup,
    commit,
    protect,
    period
  ){

    if(
      price<=0||
      cap<=0||
      !Number.isFinite(monthlyFactor)||
      loan<0||
      loan>Math.min(
        cap,
        .75*price
      )+.001||

      loan!==roundLoan(loan)||
      backup>availableCash||
      (
        v.journey==="private"&&
        sale>0&&
        net<0
      )
    ){
      return null;
    }

    const fees=
      bsd(price)+
      3000+
      price*absd;

    const down=
      price-loan;

    const upfront=
      down+fees;

    const payment=forecast(
      loan,
      commit,
      protect,
      period
    );

    const cpfFee=Math.min(
      cpf,
      fees
    );

    const cashFee=
      fees-cpfFee;

    const cpfShield=Math.min(
      Math.max(
        0,
        cpf-cpfFee
      ),
      payment.shield
    );

    const cashShield=
      payment.shield-cpfShield;

    const cpfDownAvailable=
      cpf-cpfFee-cpfShield;

    const cashDownAvailable=
      availableCash-
      backup-
      cashFee-
      cashShield;

    const cashDP=Math.max(
      .05*price,
      down-cpfDownAvailable
    );

    const cpfDP=
      down-cashDP;

    if(
      cashDP>cashDownAvailable+.001||
      cpfDP<-.001||
      cpfDP>cpfDownAvailable+.001
    ){
      return null;
    }

    return{
      price,
      loan,
      fees,
      down,
      upfront,
      cpfFee,
      cashFee,
      cpfDP,
      cashDP,
      cpfShield,
      cashShield,
      ltv:100*loan/price,
      ...payment
    };
  }

  /* ==================================
     CHECK PROPERTY PRICE
  ================================== */

  function at(
    price,
    backup,
    commit,
    protect,
    period
  ){

    const loan=roundLoan(
      Math.min(
        cap,
        .75*price
      )
    );

    let found=fit(
      price,
      loan,
      backup,
      commit,
      protect,
      period
    );

    if(found||!protect){
      return found;
    }

    for(
      let reduction=1000;
      reduction<=Math.min(
        300000,
        loan
      );
      reduction+=1000
    ){

      found=fit(
        price,
        loan-reduction,
        backup,
        commit,
        protect,
        period
      );

      if(found){
        return found;
      }
    }

    return null;
  }

  /* ==================================
     SOLVE MAXIMUM PURCHASE PRICE
  ================================== */

  function solve(
    backup,
    commit,
    protect,
    period
  ){

    if(!cap){
      return null;
    }

    let lo=1;
    let hi=4500;
    let best=null;

    while(lo<=hi){

      const mid=Math.floor(
        (lo+hi)/2
      );

      const candidate=at(
        mid*1000,
        backup,
        commit,
        protect,
        period
      );

      if(candidate){
        best=candidate;
        lo=mid+1;
      }else{
        hi=mid-1;
      }
    }

    return best;
  }

  /* ==================================
     STRUCTURE A
  ================================== */

  const A=solve(
    0,
    0,
    false,
    48
  );

  /* ==================================
     STRUCTURE B
  ================================== */

  const originalB=solve(
    num(v.backup),
    num(v.commit),
    v.protection,
    v.period
  );

  const baselineB=v.protection?
    solve(
      num(v.backup),
      0,
      true,
      v.period
    ):
    null;

  const spare=originalB?
    Math.max(
      0,
      cpf-
      originalB.cpfFee-
      originalB.cpfShield-
      originalB.cpfDP
    ):
    0;

  let B=originalB;
  let reduction=0;

  if(
    B&&
    v.choice==="reduce"&&
    spare>=1000
  ){

    const amount=Math.min(
      roundLoan(spare),
      B.loan
    );

    const candidate=fit(
      B.price,
      B.loan-amount,
      num(v.backup),
      0,
      false,
      v.period
    );

    if(candidate){
      B=candidate;
      reduction=amount;
    }
  }

  /* ==================================
     INCOME-BASED PURCHASE CAPACITY
  ================================== */

  const bench=
    Math.round((cap/.75)/1000)*1000;

  const benchFees=cap>0?
    bsd(bench)+
    3000+
    bench*absd:
    0;

  const benchUp=
    .25*bench+benchFees;

  const funding=allocateFunding(
    bench,
    availableCash,
    cpf,
    benchFees
  );

  return{
    commission,
    fee,
    net,

    cash:availableCash,
    cpf,
    equity,

    income,
    age,
    tenure,
    cap,
    absd,

    perBuyer,
    combined,

    A,
    B,
    spare,
    reduction,

    extraPurchase:
      v.protection&&
      originalB&&
      baselineB?
        Math.max(
          0,
          originalB.price-
          baselineB.price
        ):
        0,

    bench,
    benchFees,
    benchUp,

    benchOK:
      cap>0&&
      funding.shortfall<.005,

    funding
  };
}

   SHARED INTERFACE HELPERS
====================================== */

/* ======================================

====================================== */

function incomeCapacity(R){
  const F=R.funding;
  const valid=R.cap>0;
  const isShort=valid&&F.shortfall>.005;
  const cashOnlyIssue=isShort&&F.cashShort>.005&&F.twentyShort<.005&&F.feeShort<.005;
  const available=R.cash+R.cpf;
  const price=R.bench;
  const minCash=.05*R.bench;
  const down=.25*R.bench;
  const cashShort=F.cashShort;
  const remainingShort=F.twentyShort+F.feeShort;
  // Surplus CPF remains visible even when mandatory cash is short.
  // Cash may substitute for CPF in the 20% downpayment, not vice versa.
  const cashSurplus=F.cashRemain;
  const cpfSurplus=F.cpfRemain;
  const detail=(label,amount,tone="")=>`<div class="line" style="margin:7px 0;align-items:baseline"><span>${label}</span><strong style="color:${tone||'var(--navy)'};font-variant-numeric:tabular-nums">${cash(amount)}</strong></div>`;

  return `
    <section class="accordion">
      <button class="acc-button capacity-header"
        data-open="capacity" aria-expanded="${opened.capacity}">
        <span class="capacity-title">
          ${uiIcon("key")}
          <span>INCOME-BASED PURCHASE CAPACITY</span>
        </span>
        <span>${opened.capacity?"⌃":"⌄"}</span>
      </button>

      ${opened.capacity?`
        <div class="capacity-price">
          <div class="small">Potential Property Price</div>
          <div class="big">${cash(price)}</div>
        </div>
        <div class="panel" style="margin-top:10px">
          <div class="row"><strong style="color:var(--navy)">Max Loan (75% LTV)</strong><strong>${cash(R.cap)}</strong></div>
          <div class="small" style="margin-top:5px">Income-assessed loan ceiling; property price rounded to nearest $1,000.</div>
        </div>
        <div class="capacity-metrics" style="margin:20px 0 12px;align-items:start;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px">
          <div style="min-width:0">
            <div class="small">Upfront Required</div>
            <div class="mid" style="font-variant-numeric:tabular-nums">${cash(R.benchUp)}</div>
            <div class="small" style="margin-top:10px">5% Cash ${cash(minCash)}</div>
            <div class="small">20% Downpay ${cash(down-minCash)}</div>
            <div class="small">BSD + Legal + ABSD ${cash(R.benchFees)}</div>
          </div>
          <div style="min-width:0">
            <div class="small">Upfront Available</div>
            <div class="mid" style="font-variant-numeric:tabular-nums">${cash(available)}</div>
            <div class="small" style="margin-top:10px">Cash ${cash(R.cash)}</div>
            <div class="small">CPF ${cash(R.cpf)}</div>
          </div>
        </div>
        <div class="panel capacity-position" style="margin-top:12px">
          <div class="row" style="justify-content:flex-start;gap:8px;align-items:center">
            ${isShort?`<span style="color:var(--danger);font-size:19px" aria-hidden="true">⚠</span>`:valid?`<span style="color:var(--success);font-size:19px" aria-hidden="true">✓</span>`:""}
            <strong style="color:${isShort?'var(--danger)':'var(--success)'};font-size:13px">${!valid?"No Assessed Capacity":cashOnlyIssue?"Cash Requirement Not Met":isShort?"Funding Shortfall":"Funding Surplus"}</strong>
          </div>
          <div class="capacity-position-amount ${isShort?"capacity-danger":valid?"capacity-success":"capacity-neutral"}">
            ${isShort?"−":""}${cash(!valid?0:isShort?F.shortfall:F.surplus)}
          </div>
          ${valid?(isShort?`
            ${cashShort+F.feeShort>.005?detail("Cash shortfall",cashShort+F.feeShort,"var(--danger)"):""}
            ${F.twentyShort>.005?detail("20% downpayment shortfall",F.twentyShort,"var(--danger)"):""}
            ${cpfSurplus>.005?detail("CPF surplus",cpfSurplus,"var(--success)"):""}
            ${cashSurplus>.005?detail("Cash surplus",cashSurplus,"var(--success)"):""}
            ${cashOnlyIssue?`<div class="small" style="margin-top:12px">Total funds are sufficient, but more cash is needed for the minimum 5% downpayment.</div>`:""}
          `:`
            ${detail("Cash surplus",cashSurplus,"var(--success)")}
            ${detail("CPF surplus",cpfSurplus,"var(--success)")}
          `):""}
        </div>
      `:""}
    </section>
  `;
}

    </div>

    <hr>

    <div class="grid2">

      ${field(
        "Monthly Debts",
        "debts",
        {prefix:true}
      )}

      ${field(
        "Mortgage Rate (%)",
        "rate"
      )}

    </div>

    <p class="small">
      Estimated affordability uses a 4% assessment
      interest rate, 55% TDSR and up to 75% LTV.

      The mortgage rate above is used for
      the repayment forecast.

      Loan amounts are rounded down to
      the nearest $10,000.
    </p>

  </div>

  <!-- INCOME-BASED PURCHASE CAPACITY -->

  ${incomeCapacity(R)}

  <!-- STRUCTURES A AND B -->

  ${resultCard("A",R)}

  ${resultCard("B",R)}
  `;
}

/* ======================================
   INPUT EVENT HANDLING
====================================== */

document.addEventListener("change",e=>{

  const key=e.target.dataset.field;

  if(!key){
    return;
  }

  v[key]=e.target.type==="text"?
    e.target.value:
    num(e.target.value);

  render();
});

/* ======================================
   BUTTONS AND NAVIGATION
====================================== */

document.addEventListener("click",e=>{

  const node=e.target.closest(
    "button,[data-open]"
  );

  if(!node){
    return;
  }

  if(node.dataset.tab!==undefined){

    tab=Number(node.dataset.tab);

  }else if(node.dataset.set){

    const key=node.dataset.set;
    const raw=node.dataset.value;

    v[key]=[
      "period",
      "backup",
      "extra",
      "commit"
    ].includes(key)?
      Number(raw):
      raw;

  }else if(node.dataset.toggle){

    const key=node.dataset.toggle;

    v[key]=!v[key];

    if(key==="b2"&&!v.b2){
      v.b3=false;
    }

  }else if(node.dataset.open){

    const key=node.dataset.open;

    opened[key]=!opened[key];

  }else if(node.dataset.action==="back"){

    tab=Math.max(
      0,
      tab-1
    );

  }else if(node.dataset.action==="next"){

    tab=tab===3?
      0:
      tab+1;

  }else if(node.dataset.action==="reset"){

    v=initial();
    tab=0;

    Object.keys(opened).forEach(k=>{
      opened[k]=false;
    });

  }else{

    return;
  }

  render();
});

/* ======================================
   INITIALIZE APPLICATION
====================================== */

render();

</script>
