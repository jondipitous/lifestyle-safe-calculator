/* MORTGAGE PROTECTION */

<body>
<main id="app"></main>
<script>
"use strict";

/* APPLICATION STATE */

const initial=()=>({
 journey:"private",sale:0,hdb:0,refund:0,oa:0,
 pureCash:0,pureCPF:0,extraOn:false,extra:0,
 b2:false,b3:false,
 name1:"Buyer 1",age1:35,wage1:5000,status1:"SC",
 name2:"Buyer 2",age2:43,wage2:6500,status2:"SC",
 name3:"Buyer 3",age3:30,wage3:5000,status3:"SC",
 backup:0,debts:0,rate:3,commit:0,
 protection:false,period:48,choice:"protect"
});
let v=initial();
let tab=0;
const opened={capacity:false,breakdown:false,A:false,B:false};
const $=s=>document.querySelector(s);
const num=x=>Math.max(0,Number(x)||0);
const cash=x=>"$"+Math.round(Number(x)||0).toLocaleString("en-SG");
const short=x=>x>=1e6?"$"+(x/1e6).toFixed(2)+"m":x>=1e3?"$"+(x/1e3).toFixed(1)+"k":cash(x);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
}[c]));
const clamp=(x,min,max)=>Math.max(min,Math.min(max,x));
const people=()=>[1,...(v.b2?[2]:[]),...(v.b2&&v.b3?[3]:[])];
const floor10k=x=>Math.floor(Math.max(0,x)/10000)*10000;

/* STAMP DUTY AND MORTGAGE */

function bsd(price){
 let left=price,sum=0;
 for(const [width,rate] of [
  [180000,.01],[180000,.02],[640000,.03],
  [500000,.04],[1500000,.05],[Infinity,.06]
 ]){
  const part=Math.min(Math.max(left,0),width);
  sum+=part*rate;left-=part;
  if(left<=0)break;
 }
 return Math.ceil(sum);
}

function factor(rate,years){
 const months=years*12,r=rate/1200;
 if(!months)return Infinity;
 return r===0?1/months:r/(1-Math.pow(1+r,-months));
}

function oaRate(age){
 return age<=35?.23:age<=45?.21:age<=50?.19:
 age<=55?.15:age<=60?.12:age<=65?.035:
 age<=70?.01:0;
}

/* COMPLETE FINANCIAL ENGINE */

function calc(){
 const sale=num(v.sale);
 const fee=sale>0?3000:0;
 const commission=sale*.0218;
 const net=sale>0?sale-num(v.hdb)-commission-fee:0;

 const refunded=Math.min(Math.max(0,net),num(v.refund));
 const cashRaw=v.journey==="first"?
  num(v.pureCash):
  Math.max(0,net-refunded)+(v.extraOn?num(v.extra):0);
 const cpfRaw=v.journey==="first"?
  num(v.pureCPF):refunded+num(v.oa);

 const equity=Math.floor((cashRaw+cpfRaw)/1000)*1000;
 const cpf=Math.min(equity,cpfRaw);
 const availableCash=equity-cpf;

 const ids=people();
 const income=ids.reduce((a,i)=>a+num(v["wage"+i]),0);
 const age=income?ids.reduce(
  (a,i)=>a+num(v["age"+i])*num(v["wage"+i]),0
 )/income:0;

 const tenure=income?Math.max(0,Math.min(30,Math.floor(65-age))):0;
 const assessment=factor(4,tenure);

 // Loan is rounded DOWN to the nearest $10,000
 const cap=Number.isFinite(assessment)?
  floor10k(Math.max(0,income*.55-num(v.debts))/assessment):0;

 const monthlyFactor=factor(num(v.rate),tenure);
 const absd=ids.every(i=>v["status"+i]==="PR")?.05:0;

 /* CPF OA PROJECTIONS */

 const perBuyer=ids.map(i=>Array.from(
  {length:10},(_,year)=>
   Math.min(8000,num(v["wage"+i]))*
   oaRate(num(v["age"+i])+year)
 ));
 const combined=Array.from(
  {length:10},(_,y)=>perBuyer.reduce((s,arr)=>s+arr[y],0)
 );
 const flows=Array.from(
  {length:48},(_,month)=>combined[Math.floor(month/12)]
 );

 /* FOUR-YEAR MORTGAGE FORECAST */

 function forecast(loan,commit,protect,period){
  const monthly=Number.isFinite(monthlyFactor)?
   loan*monthlyFactor:0;
  let carry=0,needed=0;
  const years=[];

  for(let year=0;year<4;year++){
   let cpfPaid=0,cashPaid=0,shieldPaid=0;

   for(let m=0;m<12;m++){
    const index=year*12+m;
    const pool=carry+flows[index];
    const cp=Math.min(pool,monthly);
    const gap=Math.max(0,monthly-cp);
    const active=protect&&index<period;
    const ca=active?Math.min(commit,gap):gap;
    const sh=active?gap-ca:0;
    carry=Math.max(0,pool-cp);
    cpfPaid+=cp;cashPaid+=ca;shieldPaid+=sh;needed+=sh;
   }
   years.push({
    cpf:cpfPaid/12,cash:cashPaid/12,shield:shieldPaid/12
   });
  }
  return {
   monthly,years,
   shield:protect?Math.ceil(needed/1000)*1000:0
  };
 }

 /* PURCHASE FEASIBILITY */

 function fit(price,loan,backup,commit,protect,period){
  if(price<=0||cap<=0||!Number.isFinite(monthlyFactor)||
   loan<0||loan>Math.min(cap,.75*price)+.001||
   backup>availableCash||
   (v.journey==="private"&&sale>0&&net<0)){
   return null;
  }

  const fees=bsd(price)+3000+price*absd;
  const down=price-loan;
  const upfront=down+fees;
  const payment=forecast(loan,commit,protect,period);

  const cpfFee=Math.min(cpf,fees);
  const cashFee=fees-cpfFee;
  const cpfShield=Math.min(
   Math.max(0,cpf-cpfFee),payment.shield
  );
  const cashShield=payment.shield-cpfShield;
  const cpfDownAvailable=cpf-cpfFee-cpfShield;
  const cashDownAvailable=
   availableCash-backup-cashFee-cashShield;
  const cashDP=Math.max(.05*price,down-cpfDownAvailable);
  const cpfDP=down-cashDP;

  if(cashDP>cashDownAvailable+.001||
   cpfDP<-.001||cpfDP>cpfDownAvailable+.001){
   return null;
  }

  return {
   price,loan,fees,down,upfront,cpfFee,cashFee,
   cpfDP,cashDP,cpfShield,cashShield,
   ltv:100*loan/price,...payment
  };
 }

 function at(price,backup,commit,protect,period){
  const loan=floor10k(Math.min(cap,.75*price));
  let found=fit(price,loan,backup,commit,protect,period);

  if(found||!protect)return found;

  for(let reduction=10000;
      reduction<=Math.min(300000,loan);
      reduction+=10000){
   found=fit(
    price,loan-reduction,backup,commit,protect,period
   );
   if(found)return found;
  }
  return null;
 }

 function solve(backup,commit,protect,period){
  if(!cap)return null;
  let lo=1,hi=4500,best=null;
  while(lo<=hi){
   const mid=Math.floor((lo+hi)/2);
   const candidate=at(
    mid*1000,backup,commit,protect,period
   );
   if(candidate){best=candidate;lo=mid+1}
   else{hi=mid-1}
  }
  return best;
 }

 /* STRUCTURE A AND B */

 const A=solve(0,0,false,48);
 const originalB=solve(
  num(v.backup),num(v.commit),v.protection,v.period
 );
 const baselineB=v.protection?
  solve(num(v.backup),0,true,v.period):null;

 const spare=originalB?Math.max(
  0,cpf-originalB.cpfFee-
  originalB.cpfShield-originalB.cpfDP
 ):0;

 let B=originalB,reduction=0;

 if(B&&v.choice==="reduce"&&spare>=10000){
  const amount=Math.min(floor10k(spare),B.loan);
  const candidate=fit(
   B.price,B.loan-amount,num(v.backup),0,false,v.period
  );
  if(candidate){B=candidate;reduction=amount}
 }

 /* INCOME-BASED PURCHASE CAPACITY */

 const bench=cap>0?cap/.75:0;
 const benchFive=bench*.05;
 const benchTwenty=bench*.20;
 const benchDown=benchFive+benchTwenty;
 const benchFees=cap>0?
  bsd(bench)+3000+bench*absd:0;
 const benchUp=benchDown+benchFees;

 // Mandatory cash 5%
 const benchCash5=Math.min(availableCash,benchFive);
 const benchCashShort=Math.max(0,benchFive-benchCash5);
 const benchCashAfter5=Math.max(0,availableCash-benchCash5);

 // Remaining 20%: CPF, followed by additional cash
 const benchCPF20=Math.min(cpf,benchTwenty);
 const benchCash20=Math.min(
  benchCashAfter5,
  Math.max(0,benchTwenty-benchCPF20)
 );
 const benchTwentyShort=Math.max(
  0,benchTwenty-benchCPF20-benchCash20
 );

 // Fees funded by remaining CPF, then remaining cash
 const benchCPFBeforeFees=Math.max(0,cpf-benchCPF20);
 const benchCashBeforeFees=Math.max(
  0,benchCashAfter5-benchCash20
 );
 const benchCPFFees=Math.min(benchCPFBeforeFees,benchFees);
 const benchCashFees=Math.min(
  benchCashBeforeFees,
  Math.max(0,benchFees-benchCPFFees)
 );
 const benchFeesShort=Math.max(
  0,benchFees-benchCPFFees-benchCashFees
 );

 const benchCashLeft=Math.max(
  0,benchCashBeforeFees-benchCashFees
 );
 const benchCPFLeft=Math.max(
  0,benchCPFBeforeFees-benchCPFFees
 );
 const benchDownShort=benchCashShort+benchTwentyShort;
 const benchShortfall=benchDownShort+benchFeesShort;
 const benchSurplus=benchShortfall<.01?
  benchCashLeft+benchCPFLeft:0;
 const benchNet=benchShortfall>.005?
  -benchShortfall:benchSurplus;
 const benchOK=cap>0&&benchShortfall<.01;
 const benchBarSurplus=benchOK?benchSurplus:0;

 return {
  commission,fee,net,cash:availableCash,cpf,equity,
  income,age,tenure,cap,absd,perBuyer,combined,
  A,B,spare,reduction,
  extraPurchase:v.protection&&originalB&&baselineB?
   Math.max(0,originalB.price-baselineB.price):0,
  bench,benchFive,benchTwenty,benchDown,benchFees,benchUp,
  benchCash5,benchCash20,benchCPF20,
  benchCashShort,benchTwentyShort,benchDownShort,
  benchFeesShort,benchCashLeft,benchCPFLeft,
  benchShortfall,benchSurplus,benchNet,benchOK,benchBarSurplus
 };
}

/* ======================================

function incomeCapacity(R){

 const hasCapacity=R.cap>0;

 const positive=R.benchNet>.005;
 const negative=R.benchNet<-.005;

 const statusClass=amount=>
  amount>.005?"capacity-success":
  amount<-.005?"capacity-danger":
  "capacity-neutral";

 const signed=amount=>
  (amount<-.005?"−":amount>.005?"+":"")+
  cash(Math.abs(amount));

 const width=(amount,total)=>
  total>0?
   clamp(amount/total*100,0,100):
   0;

 const cash5Width=width(
  R.benchCash5,R.benchFive
 );

 const cash5ShortWidth=width(
  R.benchCashShort,R.benchFive
 );

 const cpf20Width=width(
  R.benchCPF20,R.benchTwenty
 );

 const cash20Width=width(
  R.benchCash20,R.benchTwenty
 );

 const twentyShortWidth=width(
  R.benchTwentyShort,R.benchTwenty
 );

 const showSurplus=R.benchBarSurplus>.005;

 return `
  <section class="accordion">

   <button
    class="acc-button capacity-header"
    data-open="capacity"
    aria-expanded="${opened.capacity}">

    <span class="capacity-title">
     ${uiIcon("key")}
     <span>
      INCOME-BASED PURCHASE CAPACITY
     </span>
    </span>

    <span>
     ${opened.capacity?"⌃":"⌄"}
    </span>

   </button>

   ${opened.capacity?`

    <!-- ESTIMATED PROPERTY PRICE -->

    <div class="capacity-price">
     <div class="small">
      Potential Property Price
     </div>

     <div class="big">
      ${cash(R.bench)}
     </div>

     <div class="small">
      Based on estimated 75% bank financing
     </div>
    </div>

    <hr style="margin:18px 0">

    <!-- 25% DOWNPAYMENT FUNDING -->

    <div class="capacity-downpayment">

     <div class="capacity-downpayment-head">
      <strong>25% DOWNPAYMENT FUNDING</strong>
      <span>${cash(R.benchDown)}</span>
     </div>

     <div class="capacity-bar-line ${
      showSurplus?"has-surplus":""
     }">

      <div
       class="capacity-bar"
       role="img"
       aria-label="
        Mandatory cash shortfall
        ${cash(R.benchCashShort)}.
        Remaining downpayment shortfall
        ${cash(R.benchTwentyShort)}.
       ">

       <!-- 5% MINIMUM CASH SECTION -->

       <div class="capacity-five">

        <div class="capacity-bar-piece cash"
         style="width:${cash5Width}%">
        </div>

        <div class="capacity-bar-piece cash-short"
         style="width:${cash5ShortWidth}%">
        </div>

       </div>

       <!-- 20% CPF / CASH SECTION -->

       <div class="capacity-twenty">

        <div class="capacity-bar-piece cpf"
         style="width:${cpf20Width}%">
        </div>

        <div class="capacity-bar-piece cash"
         style="width:${cash20Width}%">
        </div>

        <div class="capacity-bar-piece cpf-short"
         style="width:${twentyShortWidth}%">
        </div>

       </div>

      </div>

      <!-- SURPLUS EXTENDS BEYOND 25% BAR -->

      <div class="capacity-surplus-tail">
       +${cash(R.benchBarSurplus)}
      </div>

     </div>

     <!-- DOWNPAYMENT SECTION LABELS -->

     <div class="capacity-bar-captions">

      <div class="capacity-bar-caption-five">
       <strong>5% Cash</strong>
       <small>
        ${cash(R.benchFive)}
       </small>
      </div>

     <div class="capacity-legend">

      <div class="capacity-legend-item">

    <hr style="margin:18px 0">

    <!-- UPFRONT SUMMARY -->

      <div class="small">

      </div>

     </div>
    </div>

    <!-- FUNDING WARNING -->

    ${hasCapacity&&!R.benchOK?`

     <p class="capacity-message">

      The estimated income-based purchase price
      is not fully funded.

      ${R.benchCashShort>0?`
       The mandatory 5% cash requirement
       has a shortfall.
      `:""}

      ${R.benchTwentyShort>0?`
       The remaining 20% downpayment
       has a shortfall.
      `:""}

      ${R.benchFeesShort>0?`
       Additional funds are required
       for stamp duties and legal fees.
      `:""}

    `:""}

    <!-- EXPANDABLE PURCHASE BREAKDOWN -->

    <button
     class="acc-button capacity-breakdown"
     data-open="breakdown"
     aria-expanded="${opened.breakdown}">

     <span>
      Explore Purchase Breakdown
     </span>

     <span>
      ${opened.breakdown?"⌃":"⌄"}
     </span>

    </button>

    ${opened.breakdown?`

     <hr style="margin:17px 0">

     <div class="capacity-breakdown-rows">

      <div class="line">
       Estimated Loan
       <strong>
        ${cash(R.cap)}
       </strong>
      </div>

      <div class="line">
       Mandatory Cash (5%)
       <strong>
        ${cash(R.benchFive)}
       </strong>
      </div>

      <div class="line">
       CPF / Cash Portion (20%)
       <strong>
        ${cash(R.benchTwenty)}
       </strong>
      </div>

      <div class="line">
       Total Downpayment (25%)
       <strong>
        ${cash(R.benchDown)}
       </strong>
      </div>

      <div class="line">
       BSD + Legal
       <strong>
        ${cash(
         R.benchFees-R.bench*R.absd
        )}
       </strong>
      </div>

      ${R.absd?`
       <div class="line">
        Assumed ABSD
        <strong>
         ${cash(R.bench*R.absd)}
        </strong>
       </div>
      `:""}

      <div class="line">
       Buyer Age / Loan Tenure
       <strong>
        ${R.age.toFixed(1)} yrs /
        ${R.tenure} yrs
       </strong>
      </div>

      <div class="line">
       Downpayment Shortfall
       <strong class="${
        statusClass(-R.benchDownShort)
       }">
        ${cash(R.benchDownShort)}
       </strong>
      </div>

      <div class="line">
       Total Funding Shortfall
       <strong class="${
        statusClass(-R.benchShortfall)
       }">
        ${cash(R.benchShortfall)}
       </strong>
      </div>

     </div>

     <div class="capacity-footnote">
      55% TDSR · 4% assessment rate ·
      75% LTV assumption · Loan rounded
      down to nearest $10,000
     </div>

    `:""}

   `:""}

  </section>
 `;
}

/* ======================================
   INPUT EVENT HANDLING
====================================== */

document.addEventListener("change",e=>{

 const key=e.target.dataset.field;

 if(!key){
  return;
 }

 v[key]=e.target.type==="text"?
  e.target.value:
  num(e.target.value);

 render();
});

/* ======================================
   BUTTONS AND NAVIGATION
====================================== */

document.addEventListener("click",e=>{

 const node=e.target.closest(
  "button,[data-open]"
 );

 if(!node){
  return;
 }

 if(node.dataset.tab!==undefined){

  tab=Number(node.dataset.tab);

 }else if(node.dataset.set){

  const key=node.dataset.set;
  const raw=node.dataset.value;

  v[key]=["period"].includes(key)?
   Number(raw):
   ["backup","extra","commit"].includes(key)?
    Number(raw):
    raw;

 }else if(node.dataset.toggle){

  const key=node.dataset.toggle;

  v[key]=!v[key];

  if(key==="b2"&&!v.b2){
   v.b3=false;
  }

 }else if(node.dataset.open){

  const key=node.dataset.open;

  opened[key]=!opened[key];

 }else if(node.dataset.action==="back"){

  tab=Math.max(0,tab-1);

 }else if(node.dataset.action==="next"){

  tab=tab===3?0:tab+1;

 }else if(node.dataset.action==="reset"){

  v=initial();
  tab=0;

  Object.keys(opened).forEach(k=>{
   opened[k]=false;
  });

 }else{

  return;

 }

 render();
});

/* ======================================
   INITIALIZE APPLICATION
====================================== */

render();
